<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✦ malinkadev</title>
  <meta name="theme-color" content="#030200" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050300'/%3E%3Cpath d='M32 6 C34 23 41 30 58 32 C41 34 34 41 32 58 C30 41 23 34 6 32 C23 30 30 23 32 6 Z' fill='%23ffb000'/%3E%3C/svg%3E"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Handjet:wght@500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Optical Liquid Glass lenses -->
  <svg class="liquid-svg-defs" aria-hidden="true" width="0" height="0">
    <defs>
      <filter id="liquid-glass-lens" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.015" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="5" result="softMap" />
        <feDisplacementMap in="SourceGraphic" in2="softMap" scale="32" xChannelSelector="R" yChannelSelector="G" result="refracted" />
        <feGaussianBlur in="refracted" stdDeviation="1.1" result="smooth" />
        <feColorMatrix in="smooth" type="saturate" values="1.4" />
      </filter>

      <filter id="liquid-glass-card" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.016" numOctaves="2" seed="17" result="cardNoise" />
        <feGaussianBlur in="cardNoise" stdDeviation="3.5" result="cardSoft" />
        <feDisplacementMap in="SourceGraphic" in2="cardSoft" scale="24" xChannelSelector="R" yChannelSelector="G" result="cardRefracted" />
        <feGaussianBlur in="cardRefracted" stdDeviation="0.9" result="cardSmooth" />
        <feColorMatrix in="cardSmooth" type="saturate" values="1.5" />
      </filter>

      <filter id="liquid-glass-pill" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.032 0.032" numOctaves="2" seed="11" result="pNoise" />
        <feGaussianBlur in="pNoise" stdDeviation="2.5" result="pSoft" />
        <feDisplacementMap in="SourceGraphic" in2="pSoft" scale="18" xChannelSelector="R" yChannelSelector="G" result="pRefract" />
        <feGaussianBlur in="pRefract" stdDeviation="0.6" result="pSmooth" />
        <feColorMatrix in="pSmooth" type="saturate" values="1.65" />
      </filter>
    </defs>
  </svg>

  <audio id="bgAudio" src="track.mp3" loop preload="auto" crossorigin="anonymous"></audio>

  <!-- Liquid Glass Photosensitivity Warning (borderless text, appear & dissolve only) -->
  <div id="entryGate" class="entry-gate" role="dialog" aria-modal="true" aria-labelledby="warnTitle">
    <div class="entry-hero" id="entryHero">
      <h2 id="warnTitle" class="entry-title">PHOTOSENSITIVITY WARNING</h2>
      <p class="entry-desc">
        This experience contains bright flashing lights, strobe pulses, rapid glitch transitions, and loud synced audio.
      </p>
      <div class="entry-actions">
        <button id="enterBtn" class="entry-btn" type="button">AGREE</button>
      </div>
    </div>
  </div>

  <!-- Fixed Audio-Synced ASCII FX stage -->
  <div id="stageFixed" class="stage-fixed" aria-hidden="true" inert>
    <canvas id="glowCanvas" class="layer layer--glow"></canvas>
    <canvas id="mainCanvas" class="layer layer--main"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <!-- First screen: pure animation + pull-down arrow -->
  <section class="hero-spacer" id="heroSection" inert>
    <a href="#profileSheet" class="scroll-cue" id="scrollCue" aria-label="Scroll down">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </a>
  </section>

  <!-- Seamless Liquid Glass sheet with centered profile -->
  <section class="profile-sheet" id="profileSheet" inert>
    <div class="liquid-sheet-backdrop" aria-hidden="true"></div>
    <canvas id="sheetFxCanvas" class="sheet-fx-canvas" aria-hidden="true"></canvas>
    <div class="sheet-scanlines" aria-hidden="true"></div>

    <div class="profile-hero">
      <h1 class="profile-title glitch-text" data-text="malinkadev">malinkadev</h1>

      <div class="profile-meta">
        <span class="meta-name glitch-text" data-text="Artem">Artem</span>
        <span class="meta-dot" aria-hidden="true"></span>
        <span class="meta-age glitch-text" data-text="16 y.o.">16 y.o.</span>
      </div>

      <div class="profile-socials">
        <a href="https://t.me/malinkadev" target="_blank" rel="noopener noreferrer" class="social-btn social-tg" aria-label="Telegram" title="Telegram">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
          </svg>
        </a>

        <a href="https://github.com/zed712969-crypto" target="_blank" rel="noopener noreferrer" class="social-btn social-gh" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
        </a>

        <a href="https://malinka.space" target="_blank" rel="noopener noreferrer" class="social-btn social-web" aria-label="malinka.space" title="malinka.space">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17L17 7"></path>
            <path d="M8 7h9v9"></path>
          </svg>
        </a>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
